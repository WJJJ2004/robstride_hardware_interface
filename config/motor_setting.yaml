hardware_interface_node:
  ros__parameters:
    can_interfaces: ["can_right_arm", "can_left_arm", "can_right_leg", "can_left_leg"]
    baud_rate: 1000000
    control_frequency_hz: 300.0

    can_right_arm:
      motor_ids: [22, 23, 1, 3, 5, 7]
      motor_type: [00, 00, 06, 06, 00, 00]

    can_left_arm:
      motor_ids: [0, 2, 4, 6]
      motor_type: [06, 06, 00, 00]

    can_right_leg:
      motor_ids: [9, 11, 13, 15, 17, 19, 21]
      motor_type: [06, 04, 03, 03, 04, 06, 06]

    can_left_leg:
      motor_ids: [10, 12, 14, 16, 18, 20]
      motor_type: [04, 03, 03, 04, 06, 06]

